name: PUC Weekly PDF Report

on:
  # Runs after the daily update in the same local timezone.
  schedule:
    - cron: "0 2 * * 1"
      timezone: "America/Costa_Rica"
  # and can be triggered manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birdweather-content-writes
  cancel-in-progress: false

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    env:
      TZ: America/Costa_Rica

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # important so pull/rebase works
          ref: main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libuv1-dev

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.1"

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install R packages for weekly report
        run: |
          Rscript -e 'install.packages(c(
            "readr","dplyr","lubridate","ggplot2","forcats",
            "rmarkdown"
          ), repos="https://cloud.r-project.org")'

      - name: Render weekly PDF report
        run: |
          Rscript scripts/render_weekly_report.R

      - name: Find report filename
        id: find_report
        run: |
          FILE=$(ls reports/PUC_weekly_report_*.pdf | sort | tail -n 1)
          echo "report_file=$FILE" >> $GITHUB_OUTPUT
          echo "Found report: $FILE"

      - name: Upload report as artifact
        uses: actions/upload-artifact@v5
        with:
          name: weekly-report
          path: ${{ steps.find_report.outputs.report_file }}

      - name: Commit and push weekly report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add reports
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit"
            exit 0
          fi
          git commit -m "Update weekly bird report"
          git pull --rebase origin main
          git push origin HEAD:main
