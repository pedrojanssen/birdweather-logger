name: BirdWeather daily data and dashboard

on:
  schedule:
    - cron: "5 1 * * *"
      timezone: "America/Costa_Rica"
  # Allow manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: birdweather-content-writes
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      TZ: America/Costa_Rica

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system libraries for curl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("httr","jsonlite","dplyr","lubridate","readr","ggplot2"), repos = "https://cloud.r-project.org")'

      - name: Run daily BirdWeather script
        env:
          BW_API_KEY: ${{ secrets.BW_API_KEY }}
          BW_DEVICE_ID: ${{ secrets.BW_DEVICE_ID }}
        run: |
          Rscript scripts/birdweather_daily.R

      - name: Download BirdNET seasonal probabilities to temporary storage
        run: |
          python3 scripts/fetch_seasonal_probabilities.py \
            --input data/master_detections.csv \
            --output "${RUNNER_TEMP}/seasonal-probabilities.json"

      - name: Build privacy-limited dashboard JSON
        run: |
          python3 scripts/build_dashboard_json.py \
            --probabilities-input "${RUNNER_TEMP}/seasonal-probabilities.json"

      - name: Test dashboard generator and privacy guard
        run: |
          python3 -m unittest discover -s tests -v

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No daily data or dashboard changes to commit"
            exit 0
          fi
          git commit -m "Daily data and dashboard update"
          git pull --rebase origin main
          git push origin HEAD:main
